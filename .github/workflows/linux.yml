name: Linux service checks and distribution
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run check
      - run: node scripts/qa/headless.cjs
      - run: node scripts/package-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Relay-Linux-Server
          path: release/*.tar.gz
          if-no-files-found: error
