# Install inside nginx's http context. Replace relay.example.com in all places.
# Obtain the certificate with a webroot-only HTTP vhost before enabling TLS.
map $http_origin $relay_origin_allowed {
    default 0;
    "" 1;
    "https://relay.example.com" 1;
}
server {
    listen 80;
    server_name relay.example.com;
    location /.well-known/acme-challenge/ { root /var/www/codex-relay-acme; }
    location / { return 301 https://relay.example.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name relay.example.com;
    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    if ($host != relay.example.com) { return 444; }
    if ($relay_origin_allowed = 0) { return 403; }
    location / {
        proxy_pass http://127.0.0.1:7899;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:7899;
        # Origin was checked above; the loopback server accepts only its own origin.
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        access_log off;
    }
}
